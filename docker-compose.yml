services:
  auth-service:
    build:
      context: ./auth-service
    container_name: wspeedrun-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_PORT: ${AUTH_SERVICE_PORT:-3000}
    ports:
      - "${AUTH_SERVICE_PORT:-3000}:${AUTH_SERVICE_PORT:-3000}"

  game-service:
    build:
      context: ./game-service
    container_name: wspeedrun-game-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${GAME_DATABASE_URL:?GAME_DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      GAME_SERVICE_PORT: ${GAME_SERVICE_PORT:-3001}
    ports:
      - "${GAME_SERVICE_PORT:-3001}:${GAME_SERVICE_PORT:-3001}"

  run-service:
    build:
      context: ./run-service
    container_name: wspeedrun-run-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${RUN_DATABASE_URL:?RUN_DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RUN_SERVICE_PORT: ${RUN_SERVICE_PORT:-3002}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3000}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://game-service:3001}
      SERVICE_REQUEST_TIMEOUT_MS: ${SERVICE_REQUEST_TIMEOUT_MS:-10000}
    ports:
      - "${RUN_SERVICE_PORT:-3002}:${RUN_SERVICE_PORT:-3002}"
    depends_on:
      auth-service:
        condition: service_started
      game-service:
        condition: service_started

  api-gateway:
    build:
      context: ./api-gateway
    container_name: wspeedrun-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-3003}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3000}
      GAME_SERVICE_URL: ${GAME_SERVICE_URL:-http://game-service:3001}
      RUN_SERVICE_URL: ${RUN_SERVICE_URL:-http://run-service:3002}
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-15000}
    ports:
      - "${API_GATEWAY_PORT:-3003}:${API_GATEWAY_PORT:-3003}"
    depends_on:
      auth-service:
        condition: service_started
      game-service:
        condition: service_started
      run-service:
        condition: service_started
